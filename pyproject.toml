[project]
name = "honcho-adapter"
version = "2.0.1"
description = "Honcho's reasoning-first memory, extracted and bridged into your existing Hermes stack"
authors = [
    {name = "0x-wzw", email = "zehan.teoh@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    # LLM providers — install what you use
    # "openai>=1.0.0",
    # "anthropic>=0.30.0",
    # "google-genai>=1.0.0",
    # Core
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
gemini = ["google-genai>=1.0.0"]
all = ["openai>=1.0.0", "anthropic>=0.30.0", "google-genai>=1.0.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.urls]
Homepage = "https://github.com/0x-wzw/honcho-adapter"
Source = "https://github.com/0x-wzw/honcho-adapter"

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"